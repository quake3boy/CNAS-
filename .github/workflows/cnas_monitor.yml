name: CNAS培训通知监控

on:
  schedule:
    - cron: '0 1,4,7,10,10 * * *'
  workflow_dispatch:   # 加上这一行，就会出现绿色Run workflow按钮
  schedule:
    # UTC时间 = 北京时间 -8小时
    # 北京09:05 → UTC 01:05
    # 北京12:05 → UTC 04:05
    # 北京15:05 → UTC 07:05
    # 北京18:05 → UTC 10:05
    - cron: '5 1,4,7,10 * * *'
  workflow_dispatch:  # 允许手动触发测试

permissions: write-all

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 同步最新代码
        run: git pull origin main

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装OCR引擎和依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim poppler-utils
          pip install requests beautifulsoup4 pytesseract pdf2image

      - name: 运行监控脚本
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          # 标记本次执行对应的北京时间小时，脚本读取这个变量
          RUN_BEIJING_HOUR: ${{
              (github.event.schedule == '5 1,4,7,10 * * *') && (
                  github.event.schedule | split(',')[0] == '5 1' && '9' ||
                  github.event.schedule | split(',')[0] == '5 4' && '12' ||
                  github.event.schedule | split(',')[0] == '5 7' && '15' ||
                  github.event.schedule | split(',')[0] == '5 10' && '18'
              ) || 'manual'
          }}
        run: python cnas_monitor.py

      - name: 提交状态文件更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cnas_monitor_state.json
          git diff --staged --quiet || git commit -m "更新监控状态 [skip ci]"
          git push
