name: CNAS培训通知监控
on:
  schedule:
    # 北京时间 8:30 ~ 18:30，每小时运行一次（半点执行）
    # 北京时间 = UTC + 8，因此：
    #   北京 8:30  = UTC 0:30
    #   北京 18:30 = UTC 10:30
    - cron: '30 0-10 * * *'   # UTC 0:30,1:30,...,10:30 → 北京 8:30,9:30,...,18:30
  workflow_dispatch:
permissions: write-all
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # 单次任务最多8分钟，卡死自动终止，避免浪费时长
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 替换apt国内源，加速安装
        run: |
          sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://mirrors.aliyun.com|g' /etc/apt/sources.list
          sudo sed -i 's|http://archive.ubuntu.com|http://mirrors.aliyun.com|g' /etc/apt/sources.list
      - name: 安装OCR引擎和依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim poppler-utils
          pip install requests beautifulsoup4 pytesseract pdf2image
      - name: 运行监控脚本
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python cnas_monitor.py
      - name: 提交状态文件更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cnas_monitor_state.json
          git diff --staged --quiet || git commit -m "更新监控状态 [skip ci]"
          git pull origin main --rebase
          git push
