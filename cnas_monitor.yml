name: CNAS培训通知监控

on:
  schedule:
    # UTC时间，对应北京时间 08:30-18:00 每半小时
    # UTC 0:30 = 北京8:30, UTC 10:00 = 北京18:00
    - cron: '0,30 0-10 * * *'
  workflow_dispatch:  # 允许手动触发测试

permissions: write-all

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装OCR引擎和依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim poppler-utils
          pip install requests beautifulsoup4 pytesseract pdf2image

      - name: 运行监控脚本
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python cnas_monitor.py

      - name: 提交状态文件更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main --rebase --autostash
          git add cnas_monitor_state.json
          git diff --staged --quiet || git commit -m "更新监控状态 [skip ci]"
          git push
